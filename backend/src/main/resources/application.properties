# Nombre de la aplicacion
spring.application.name=backend
server.port=8080

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/semilleros_v2_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate (Flyway gestiona el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracion de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuracion de Spring Boot DevTools (LiveReload & Auto-restart)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

